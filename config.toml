# free-granola config

# Glob pattern for the vault directory.
# This local folder is registered as a Google Drive "mirrored root" (Drive for
# Desktop → Computers backup), so it syncs to Drive automatically. Point this at
# the real folder, not at a CloudStorage path.
vault_path_glob = "~/GranolaVault"

# Optional attendee aliases — map raw email or display string to a canonical name
# for cleaner [[wikilinks]] in frontmatter.
[attendee_aliases]
# "alex.chen@example.com" = "Alex Chen"
